<script>/* theme1: set the theme before first paint (no flash): saved choice, else the device setting */(function(){var t=null;try{t=localStorage.getItem('p13:theme')}catch(e){}if(t!=='light'&&t!=='dark')t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',t==='dark'?'#121316':'#ffffff')})()</script>
