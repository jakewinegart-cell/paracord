<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Paracord — Demo stock insurance</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%237c5cff%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="projections.css">
</head>
<body>
<div id="app" class="phone">
  <div class="demo-banner" role="note">DEMO — simulated prices, no real trades</div>
  <header class="topbar">
    <button id="backBtn" class="icon-btn" aria-label="Back" hidden>&#8592;</button>
    <div class="brand" id="brand"><span class="logo">⟆</span><span>Paracord</span></div>
    <div class="title" id="title"></div>
    <button id="demoChip" class="demo-chip" aria-label="Open demo menu">DEMO ⚙</button>
  </header>
  <main id="view" tabindex="-1"></main>
  <nav class="tabs" id="tabs">
    <button data-tab="home"><span class="ti">◧</span>Portfolio</button>
    <button data-tab="insured"><span class="ti">⛨</span>Insured</button>
    <button data-tab="accounts"><span class="ti">⛓</span>Accounts</button>
    <button data-tab="demo"><span class="ti">⚙</span>Demo</button>
    <button data-tab="projections"><span class="ti">∿</span>Projections</button>
  </nav>
  <div id="sheetRoot"></div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>
<script src="rate.js"></script>
<script src="data.js"></script>
<script src="sim.js"></script>
<script src="projections.js"></script>
<script src="app.js"></script>
</body>
</html>
