<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Paracord — Demo stock insurance</title>
<link rel="icon" type="image/svg+xml" href="logo-on-black.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="stylesheet" href="styles.css?v=p3">
<link rel="stylesheet" href="projections.css?v=p3">
</head>
<body>
<div id="app" class="phone">
  <div class="demo-banner" role="note">DEMO — simulated prices, no real trades</div>
  <header class="topbar">
    <button id="backBtn" class="icon-btn" aria-label="Back" hidden>&#8592;</button>
    <div class="brand" id="brand"><img class="logo" src="logo.svg" alt="" width="32" height="32"><span>Paracord</span></div>
    <div class="title" id="title"></div>
    <button id="demoChip" class="demo-chip" aria-label="Open demo menu">DEMO ⚙</button>
  </header>
  <main id="view" tabindex="-1"></main>
  <nav class="tabs" id="tabs">
    <button data-tab="home"><span class="ti">◧</span>Portfolio</button>
    <button data-tab="insured"><span class="ti">⛨</span>Insured</button>
    <button data-tab="accounts"><span class="ti">⛓</span>Accounts</button>
    <button data-tab="demo"><span class="ti">⚙</span>Demo</button>
    <button data-tab="projections"><span class="ti">∿</span>Projections</button>
  </nav>
  <div id="sheetRoot"></div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>
<script src="rate.js?v=p3"></script>
<script src="data.js?v=p3"></script>
<script src="sim.js?v=p3"></script>
<script src="projections.js?v=p3"></script>
<script src="app.js?v=p3"></script>
</body>
</html>
